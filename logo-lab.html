<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>SandBox logo lab</title>
    <style>
      .lab { padding: 2rem var(--pad) 4rem; display: grid; gap: 2.5rem; background: var(--paper); }
      .lab-head h1 { font-weight: 900; font-stretch: 125%; text-transform: uppercase; font-size: clamp(2rem, 6vw, 4rem); line-height: 0.95; }
      .lab-head p { max-width: 40em; margin-top: 0.75rem; }
      .lab-row { display: grid; gap: 1rem; padding-top: 1.5rem; border-top: 2px solid var(--ink); }
      .lab-row h2 { font-weight: 900; font-stretch: 118%; text-transform: uppercase; font-size: 1.5rem; }
      .lab-row p { color: var(--on-paper-2); max-width: 40em; }
      .lab-grounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.75rem; }
      .lab-ground { position: relative; display: flex; align-items: end; gap: 1.25rem; padding: 1.25rem; box-shadow: inset 0 0 0 2px var(--ink); }
      .lab-sizes { display: flex; align-items: end; gap: 0.9rem; }
      .lab-ground__name { position: absolute; top: 0.6rem; right: 0.75rem; font-size: 0.6875rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
      .lab-tab { display: inline-flex; align-items: center; gap: 0.5rem; justify-self: start; padding: 0.45rem 0.8rem; background: #e8e6df; border-radius: 8px 8px 0 0; font: 0.75rem system-ui, sans-serif; color: #333; }
      .lab-lockup { display: flex; align-items: center; gap: 0.6rem; height: 3.5rem; padding-inline: 1rem; box-shadow: inset 0 0 0 2px var(--ink); }
      .lab-lockup__wm { --strip-h: 22px; display: block; }
      .lab-lockup__wm .wm { height: 22px; width: calc(22px * 6.36); }
      .lab-lockup__v { font-family: var(--mono); font-weight: 600; font-size: 0.72rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/lab/LogoLab.tsx"></script>
  </body>
</html>
